[project]
name = "odil-data-aug-check-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Keep the explicit "# -*- coding: utf-8 -*-" declaration.
ignore = ["UP009"]
